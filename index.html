<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Hello World!</title><script src="bundle.js"></script></head><body><a-scene><a-assets><img id="floor-image" alt="" src="./images/backglow.png"/></a-assets><a-entity environment="
          lightPosition: 1 2 2;
          groundColor: #040223;
          groundColor2: #040223;
          groundTexture: walkernoise;
          skyType: gradient; 
          skyColor: #040223 ; horizonColor: #16124E;
          grid: crosses; gridColor: white;
          
          fog: 0.995;
          

          "></a-entity><a-box position="0 0 2.5" color="#3385ff" height=".25" waypoint=".125"></a-box><a-entity id="links" layout="type: line; margin: 1.5" position="3 2 7" rotation="10 -70 0"><a-entity template="src: #pic"></a-entity><a-entity template="src: #pic"></a-entity><a-entity template="src: #pic"></a-entity><a-entity template="src: #pic"></a-entity></a-entity><a-camera position="0 1 10"><a-cursor id="cursor" animation__click="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; easing: easeInCubic; dur: 150; startEvents: click" animation__clickreset="property: scale; to: 0.1 0.1 0.1; dur: 1; startEvents: animationcomplete__click" animation__fusing="property: scale; from: 1 1 1; to: 0.1 0.1 0.1; easing: easeInCubic; dur: 150; startEvents: fusing"></a-cursor></a-camera><a-box aim="color: red" position="-10 0 5" color="red"></a-box><a-box aim="color: blue" position="10 0 5" color="blue"></a-box><a-box aim="color: green; glyph: ←" position="0 1 5" color="green"></a-box><a-sky color="#040223"></a-sky><a-entity><a-box aim="color: white" position="0 0 10" color="red" visible="false"></a-box><a-image position="0 0.01 10" rotation="-90 0 0" width="4" height="4" src="#floor-image"></a-image></a-entity></a-scene></body></html>
